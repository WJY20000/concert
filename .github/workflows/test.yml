name: Mock checkout tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run offline browser simulations
        shell: bash
        run: |
          mkdir -p test-artifacts
          set -o pipefail
          npm test 2>&1 | tee test-artifacts/test.log
      - name: Upload simulation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-checkout-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
